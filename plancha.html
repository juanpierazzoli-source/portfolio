<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plancha dorada — Juan Pierazzoli</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<meta name="description" content="Modelo 3D de una plancha en oro pulido. Arrastrá para girarla." />
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f2f0ec;
    font-family: ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: #2b2620;
    overflow: hidden;
  }

  /* fondo de estudio: el degradé es lo que le da forma al metal */
  .escena {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% 8%, #ffffff 0%, #f4f1ea 42%, #ddd6c8 100%);
  }

  model-viewer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    --poster-color: transparent;
    --progress-bar-color: #c9a227;
    --progress-bar-height: 3px;
  }

  .titulo {
    position: fixed;
    top: 26px;
    left: 28px;
    z-index: 2;
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .titulo span {
    display: block;
    margin-top: 5px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: none;
    opacity: 0.5;
  }

  .ayuda {
    position: fixed;
    left: 28px;
    bottom: 22px;
    z-index: 2;
    margin: 0;
    font-size: 11px;
    line-height: 1.6;
    opacity: 0.45;
  }

  /* controles de acabado */
  .panel {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 3;
    width: 216px;
    padding: 14px 16px 16px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 10px 34px rgba(90, 70, 40, 0.16);
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.5;
  }
  .ctrl { margin-bottom: 10px; }
  .ctrl__fila {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 4px;
  }
  .ctrl__valor { font-variant-numeric: tabular-nums; font-size: 11px; opacity: 0.55; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 4px;
    background: rgba(140, 115, 60, 0.25);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #c9a227;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(90, 70, 40, 0.35);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: #c9a227; border: 2px solid #fff; cursor: pointer;
  }
  .chips { display: flex; gap: 6px; margin-top: 2px; }
  .chip {
    flex: 1;
    border: 0;
    border-radius: 999px;
    padding: 6px 4px;
    font: inherit;
    font-size: 11px;
    background: rgba(255, 255, 255, 0.9);
    color: #6b5620;
    cursor: pointer;
  }
  .chip:hover { background: #f6ecc9; }
  .chip.is-activo { background: #2b2620; color: #fff; }

  @media (max-width: 680px) {
    .panel { left: 14px; right: 14px; width: auto; bottom: 14px; }
    .ayuda { display: none; }
  }
</style>
</head>
<body>

  <div class="escena"></div>

  <h1 class="titulo">
    Plancha dorada
    <span>Oro pulido · modelo 3D</span>
  </h1>

  <model-viewer
    id="visor"
    src="assets/modelos/plancha.glb"
    alt="Plancha de ropa modelada en 3D con acabado de oro pulido y cable con enchufe"
    loading="eager"
    camera-controls
    auto-rotate
    auto-rotate-delay="900"
    rotation-per-second="14deg"
    interaction-prompt="none"
    shadow-intensity="1.1"
    shadow-softness="0.85"
    exposure="1.15"
    tone-mapping="commerce"
    environment-image="assets/modelos/estudio.hdr"
    camera-orbit="38deg 72deg 2.4m"
    min-camera-orbit="auto 12deg auto"
    max-camera-orbit="auto 96deg auto"
    field-of-view="28deg">
  </model-viewer>

  <p class="ayuda">Arrastrá para girar · rueda para acercar</p>

  <section class="panel">
    <h2>Acabado</h2>

    <div class="ctrl">
      <div class="ctrl__fila"><span>Luz</span><span class="ctrl__valor" id="vExp">1.15</span></div>
      <input type="range" id="exposicion" min="0.3" max="2" step="0.05" value="1.15" />
    </div>

    <div class="ctrl">
      <div class="ctrl__fila"><span>Sombra</span><span class="ctrl__valor" id="vSom">1.1</span></div>
      <input type="range" id="sombra" min="0" max="3" step="0.1" value="1.1" />
    </div>

    <div class="chips">
      <button class="chip is-activo" type="button" data-giro="on">Girando</button>
      <button class="chip" type="button" data-giro="off">Quieta</button>
    </div>
  </section>

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script>
  const visor = document.getElementById('visor');

  const liga = (idInput, idValor, atributo) => {
    const input = document.getElementById(idInput);
    const valor = document.getElementById(idValor);
    input.addEventListener('input', () => {
      visor.setAttribute(atributo, input.value);
      valor.textContent = input.value;
    });
  };
  liga('exposicion', 'vExp', 'exposure');
  liga('sombra', 'vSom', 'shadow-intensity');

  document.querySelectorAll('[data-giro]').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('[data-giro]').forEach(o => o.classList.toggle('is-activo', o === b));
      if (b.dataset.giro === 'on') visor.setAttribute('auto-rotate', '');
      else visor.removeAttribute('auto-rotate');
    });
  });
</script>
</body>
</html>
