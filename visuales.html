<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visuales generativos — Juan Pierazzoli</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<meta name="description" content="Visuales generativos: flores, corazones, calaveras y diablitos con movimiento orgánico. Parámetros editables en vivo y export a PNG y video." />
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #14101a;
    overflow: hidden;
    font-family: ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: #4a2d3a;
  }

  /* ===== Escenario (recorta el desenfoque del fondo al formato elegido) ===== */
  .escenario {
    position: fixed;
    overflow: hidden;
    background: #fff;
    transition: box-shadow 0.25s ease;
  }
  .escenario.is-encuadrado { box-shadow: 0 20px 70px rgba(0, 0, 0, 0.55); }

  /* damero: se ve solo en pantalla, marca que el fondo es transparente */
  .escenario.is-transparente {
    background-color: #fbfbfd;
    background-image:
      linear-gradient(45deg, #e3e3ec 25%, transparent 25%, transparent 75%, #e3e3ec 75%),
      linear-gradient(45deg, #e3e3ec 25%, transparent 25%, transparent 75%, #e3e3ec 75%);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
  }

  #fondo, #escena {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #fondo { filter: blur(60px) saturate(1.15); transform: scale(1.15); }
  #escena { z-index: 1; }

  /* ===== Panel de parámetros ===== */
  .panel {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 4;
    width: 300px;
    max-height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.8);
    overflow: hidden;
  }

  .panel__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
  }
  .panel__title {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .panel__toggle {
    border: 0;
    background: rgba(255, 255, 255, 0.7);
    color: inherit;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }

  .panel__body { overflow-y: auto; padding: 0 14px 14px; }
  .panel.is-cerrado .panel__body { display: none; }

  .grupo { margin-top: 12px; }
  .grupo__titulo {
    margin: 0 0 7px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.55;
  }

  .ctrl { margin-bottom: 9px; }
  .ctrl__fila {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    margin-bottom: 3px;
  }
  .ctrl__valor { font-variant-numeric: tabular-nums; font-size: 11px; opacity: 0.6; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 5px;
    border-radius: 5px;
    background: rgba(120, 90, 110, 0.28);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #ff8fb1;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: #ff8fb1; border: 2px solid #fff; cursor: pointer;
  }

  input[type="color"] {
    width: 100%; height: 26px; padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 8px; background: none; cursor: pointer;
  }

  .check { display: flex; align-items: center; gap: 7px; font-size: 12px; cursor: pointer; }
  .check input { accent-color: #ff8fb1; width: 15px; height: 15px; }

  .fila-botones { display: flex; flex-wrap: wrap; gap: 6px; }
  .fila-botones[hidden] { display: none; }   /* [hidden] pierde contra la clase */

  .chip {
    border: 0;
    border-radius: 999px;
    padding: 6px 11px;
    font: inherit;
    font-size: 11px;
    background: rgba(255, 255, 255, 0.9);
    color: #5a2f45;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .chip:hover { background: #ffe4ee; }
  .chip.is-activo { background: #2c2233; color: #fff; }
  .chip__punto {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: -1px;
  }

  .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
  .btn {
    border: 0; border-radius: 12px; padding: 9px 8px;
    font: inherit; font-size: 12px; font-weight: 600;
    background: #ffd9e4; color: #6b3049; cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease;
  }
  .btn:hover { background: #ffc6d7; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.45; cursor: default; transform: none; }
  .btn--ancho { grid-column: 1 / -1; }
  .btn--rec { background: #ffb3b3; }
  .btn--rec.is-grabando { background: #e0233a; color: #fff; }

  .nota { margin: 7px 0 0; font-size: 10.5px; line-height: 1.45; opacity: 0.55; }

  .comando {
    margin-top: 8px;
    padding: 9px 10px;
    border-radius: 10px;
    background: #2c2233;
    color: #ffe0ec;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 9.5px;
    line-height: 1.55;
    word-break: break-all;
    user-select: all;
  }
  .comando__pie { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .comando__pie .nota { margin: 0; }

  /* ===== Indicador de grabación ===== */
  .rec {
    position: fixed;
    left: 16px; top: 16px;
    z-index: 5;
    display: none;
    align-items: center;
    gap: 7px;
    padding: 7px 13px;
    border-radius: 999px;
    background: rgba(224, 35, 58, 0.92);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }
  .rec.is-visible { display: flex; }
  .rec__punto {
    width: 9px; height: 9px; border-radius: 50%; background: #fff;
    animation: latir 1s ease-in-out infinite;
  }
  @keyframes latir { 50% { opacity: 0.25; } }

  .ayuda {
    position: fixed;
    left: 16px; bottom: 14px;
    z-index: 4;
    margin: 0;
    font-size: 11px;
    line-height: 1.5;
    color: #fff;
    opacity: 0.45;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }

  @media (max-width: 680px) {
    .panel { width: auto; left: 12px; right: 12px; top: 12px; }
    .panel__body { max-height: 56vh; }
    .ayuda { display: none; }
  }
</style>
</head>
<body>

  <div class="escenario" id="escenario">
    <canvas id="fondo" aria-hidden="true"></canvas>
    <canvas id="escena" aria-label="Visual generativo con flores, corazones, calaveras y diablitos"></canvas>
  </div>

  <div class="rec" id="rec"><span class="rec__punto"></span><span id="recTiempo">0:00</span></div>

  <section class="panel" id="panel">
    <header class="panel__head" id="panelHead">
      <h1 class="panel__title">Parámetros</h1>
      <button class="panel__toggle" id="panelToggle" type="button" aria-label="Contraer panel">–</button>
    </header>
    <div class="panel__body" id="panelBody"></div>
  </section>

  <p class="ayuda">
    Mové el mouse para atraer las formas · <b>espacio</b> pausa · <b>R</b> aleatoriza · <b>H</b> oculta el panel
  </p>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   VISUALES GENERATIVOS
   ---------------------------------------------------------------------------
   Un solo sistema para todo: las formas (flores, corazones, manchas,
   calaveras, diablitos), la paleta y el formato de export son parámetros del
   mismo motor, no modos separados.

   TODO lo que se puede tocar vive en PARAMETROS. Cada entrada genera sola su
   control en el panel, así que para sumar un parámetro nuevo alcanza con
   agregarlo acá y leerlo como P.<clave> en el dibujo.

   Campos de cada parámetro:
     clave  → nombre con el que se lee en el código (P.clave)
     label  → texto visible en el panel
     min / max / paso → rango del slider
     valor  → valor inicial
     tipo   → 'rango' (default) | 'color' | 'switch'
   ═══════════════════════════════════════════════════════════════════════════ */

const PARAMETROS = [
  {
    grupo: 'Cantidad y tamaño',
    controles: [
      { clave: 'cantidad',    label: 'Cantidad de formas',   min: 5,  max: 260, paso: 1,    valor: 70 },
      { clave: 'tamano',      label: 'Tamaño base',          min: 6,  max: 160, paso: 1,    valor: 46 },
      { clave: 'variacion',   label: 'Variación de tamaño',  min: 0,  max: 1,   paso: 0.01, valor: 0.55 },
      { clave: 'latido',      label: 'Latido (respiración)', min: 0,  max: 1,   paso: 0.01, valor: 0.28 },
    ]
  },
  {
    grupo: 'Mezcla de formas',
    controles: [
      { clave: 'pesoFlores',    label: 'Flores',              min: 0, max: 10, paso: 0.1, valor: 5 },
      { clave: 'pesoCorazones', label: 'Corazones',           min: 0, max: 10, paso: 0.1, valor: 3 },
      { clave: 'pesoManchas',   label: 'Manchas abstractas',  min: 0, max: 10, paso: 0.1, valor: 2.5 },
      { clave: 'pesoCalaveras', label: 'Calaveras',           min: 0, max: 10, paso: 0.1, valor: 0 },
      { clave: 'pesoDiablitos', label: 'Diablitos',           min: 0, max: 10, paso: 0.1, valor: 0 },
      { clave: 'petalos',       label: 'Pétalos por flor',    min: 3, max: 14, paso: 1,   valor: 6 },
      { clave: 'filoPetalo',    label: 'Filo del pétalo',     min: 0.2, max: 2.2, paso: 0.05, valor: 0.6 },
      { clave: 'deformacion',   label: 'Deformación orgánica',min: 0, max: 0.6, paso: 0.01, valor: 0.22 },
    ]
  },
  {
    grupo: 'Movimiento',
    controles: [
      { clave: 'velocidad',   label: 'Velocidad',          min: 0, max: 4,   paso: 0.05, valor: 1 },
      { clave: 'fluidez',     label: 'Escala del flujo',   min: 0.2, max: 6, paso: 0.1,  valor: 1.6 },
      { clave: 'turbulencia', label: 'Turbulencia',        min: 0, max: 3,   paso: 0.05, valor: 1 },
      { clave: 'deriva',      label: 'Deriva vertical',    min: -1.5, max: 1.5, paso: 0.05, valor: -0.25 },
      { clave: 'giro',        label: 'Giro de las formas', min: 0, max: 3,   paso: 0.05, valor: 0.6 },
      { clave: 'iman',        label: 'Imán del mouse',     min: -2, max: 3,  paso: 0.05, valor: 1 },
    ]
  },
  {
    grupo: 'Color',
    controles: [
      { clave: 'tonoBase',    label: 'Tono base',        min: 0, max: 360, paso: 1,    valor: 335 },
      { clave: 'rangoTono',   label: 'Rango de tonos',   min: 0, max: 360, paso: 1,    valor: 70 },
      { clave: 'pasosColor',  label: 'Pasos de color',   min: 0, max: 8,   paso: 1,    valor: 0 },
      { clave: 'derivaTono',  label: 'Deriva del tono',  min: 0, max: 20,  paso: 0.5,  valor: 1.5 },
      { clave: 'saturacion',  label: 'Saturación',       min: 0, max: 100, paso: 1,    valor: 85 },
      { clave: 'luminosidad', label: 'Luminosidad',      min: 20, max: 95, paso: 1,    valor: 66 },
      { clave: 'opacidad',    label: 'Opacidad',         min: 0.05, max: 1, paso: 0.01, valor: 0.8 },
      { clave: 'fondo',       label: 'Color de fondo',   tipo: 'color', valor: '#fff4f7' },
      { clave: 'auras',       label: 'Manchas de fondo', min: 0, max: 1, paso: 0.01, valor: 0.5 },
    ]
  },
  {
    grupo: 'Atmósfera',
    controles: [
      { clave: 'estela',    label: 'Estela',           min: 0, max: 0.99, paso: 0.01, valor: 0.9 },
      { clave: 'brillo',    label: 'Brillo (glow)',    min: 0, max: 60,   paso: 1,    valor: 18 },
      { clave: 'contorno',  label: 'Contorno',         min: 0, max: 6,    paso: 0.1,  valor: 0 },
      { clave: 'detalles',  label: 'Detalles internos (centros, ojos, dientes)', tipo: 'switch', valor: true },
      { clave: 'brillitos', label: 'Brillitos',        tipo: 'switch',    valor: true },
      { clave: 'sinFondo',  label: 'Sin fondo (exporta con transparencia)', tipo: 'switch', valor: false },
    ]
  }
];

/* Universos: solo tocan los pesos de las formas */
const UNIVERSOS = {
  'Tierno': { pesoFlores: 5, pesoCorazones: 3, pesoManchas: 2.5, pesoCalaveras: 0, pesoDiablitos: 0 },
  'Punk':   { pesoFlores: 0, pesoCorazones: 1, pesoManchas: 1.5, pesoCalaveras: 5, pesoDiablitos: 4 },
  'Mixto':  { pesoFlores: 3, pesoCorazones: 2.5, pesoManchas: 2, pesoCalaveras: 2.5, pesoDiablitos: 2 }
};

/* Paletas: solo tocan color, fondo y brillo.
   'pasosColor' > 0 corta el rango de tonos en escalones (RGB puro, fluo, etc.). */
const PALETAS = {
  'Pastel':  { muestra: '#ffc2d6', tonoBase: 335, rangoTono: 90,  pasosColor: 0, saturacion: 75, luminosidad: 76, opacidad: 0.8,  derivaTono: 1.5, fondo: '#fff4f7', auras: 0.5, brillo: 16 },
  'Chicle':  { muestra: '#ff5fa2', tonoBase: 320, rangoTono: 140, pasosColor: 0, saturacion: 95, luminosidad: 62, opacidad: 0.85, derivaTono: 3,   fondo: '#fff0fb', auras: 0.65, brillo: 20 },
  'RGB':     { muestra: '#00ff66', tonoBase: 120, rangoTono: 360, pasosColor: 3, saturacion: 100, luminosidad: 50, opacidad: 0.85, derivaTono: 0,  fondo: '#0a0a10', auras: 0.35, brillo: 30 },
  'Fluo':    { muestra: '#39ff14', tonoBase: 150, rangoTono: 300, pasosColor: 5, saturacion: 100, luminosidad: 58, opacidad: 0.9,  derivaTono: 2,  fondo: '#0d0618', auras: 0.5,  brillo: 46 },
  'Ácido':   { muestra: '#d9ff00', tonoBase: 75,  rangoTono: 120, pasosColor: 4, saturacion: 100, luminosidad: 55, opacidad: 0.88, derivaTono: 6,  fondo: '#12100a', auras: 0.6,  brillo: 38 },
  'Noche':   { muestra: '#8f7bff', tonoBase: 265, rangoTono: 120, pasosColor: 0, saturacion: 70,  luminosidad: 72, opacidad: 0.5,  derivaTono: 1,  fondo: '#0b0a1c', auras: 0.75, brillo: 34 }
};

/* Presets: combinación completa (pisan solo las claves que nombran) */
const PRESETS = {
  'Tierno':   {},
  'Jardín':   { ...UNIVERSOS['Tierno'], pesoFlores: 9, pesoCorazones: 1, petalos: 8, tonoBase: 315, rangoTono: 120, cantidad: 110, tamano: 38, velocidad: 0.7, estela: 0.86 },
  'Amor':     { ...UNIVERSOS['Tierno'], pesoFlores: 1, pesoCorazones: 9, pesoManchas: 0.5, tonoBase: 350, rangoTono: 30, saturacion: 90, luminosidad: 64, cantidad: 60, tamano: 52, latido: 0.45, brillo: 30 },
  'Sueño':    { ...UNIVERSOS['Tierno'], pesoManchas: 8, cantidad: 40, tamano: 110, velocidad: 0.35, turbulencia: 0.4, opacidad: 0.28, estela: 0.97, brillo: 40, tonoBase: 260, rangoTono: 120, luminosidad: 78, deformacion: 0.4 },
  'Punk':     { ...UNIVERSOS['Punk'], ...PALETAS['Fluo'], cantidad: 55, tamano: 62, velocidad: 1.4, turbulencia: 1.4, giro: 1.2, latido: 0.35, estela: 0.84, deformacion: 0.3, contorno: 0 },
  'Cumbia':   { ...UNIVERSOS['Mixto'], ...PALETAS['RGB'], cantidad: 120, tamano: 34, velocidad: 2, turbulencia: 2, giro: 2, estela: 0.8 },
  'Caramelo': { ...UNIVERSOS['Tierno'], ...PALETAS['Chicle'], tonoBase: 40, rangoTono: 170, cantidad: 140, tamano: 26, velocidad: 1.8, turbulencia: 1.8, giro: 2, estela: 0.8 },
  'Caos':     { ...UNIVERSOS['Mixto'], cantidad: 200, tamano: 20, velocidad: 3, turbulencia: 2.6, fluidez: 4.5, giro: 2.6, estela: 0.72, rangoTono: 180, deformacion: 0.5 }
};

/* Formatos de encuadre y export. 'libre' usa toda la ventana. */
const FORMATOS = {
  'Pantalla': { ratio: null,     ancho: 0,    alto: 0 },
  '16:9':     { ratio: 16 / 9,   ancho: 1920, alto: 1080 },
  '1:1':      { ratio: 1,        ancho: 1080, alto: 1080 }
};

/* Con 'sin fondo' el archivo exportado sale sin la aguada de color. Qué queda
   en su lugar lo decide el matte: transparencia real (WebM VP9 / PNG) o un
   color plano para cromar en el editor. */
const MATTES = {
  'Transparente': null,
  'Verde':        '#00b140',
  'Magenta':      '#ff00ff',
  'Negro':        '#000000'
};

/* ═══════════════════ Estado ═══════════════════ */

const P = {};
const DEFECTOS = {};
PARAMETROS.forEach(g => g.controles.forEach(c => { P[c.clave] = c.valor; DEFECTOS[c.clave] = c.valor; }));

const escenario = document.getElementById('escenario');
const escena = document.getElementById('escena');
const ctx = escena.getContext('2d');
const fondo = document.getElementById('fondo');
const fctx = fondo.getContext('2d');

let W = 0, H = 0, DPR = 1;
let formato = 'Pantalla';
let matte = 'Transparente';
let formas = [], auras = [], brillitos = [];
let tiempo = 0;
let pausado = false;
let mouse = { x: -9999, y: -9999, activo: false };

/* ═══════════════════ Utilidades ═══════════════════ */

const azar  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* redondea al paso del slider y limpia la basura de coma flotante (0.30000000004) */
function alPaso(v, paso) {
  const dec = (String(paso).split('.')[1] || '').length;
  return parseFloat((Math.round(v / paso) * paso).toFixed(dec));
}

function hexARgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

/* Campo de flujo orgánico.
   Se parte de un potencial escalar (suma de senos) y se toma su rotor:
   velocidad = (∂ψ/∂v, -∂ψ/∂u). Al tener divergencia cero, el campo no genera
   sumideros, así que las formas fluyen en remolinos SIN amontonarse en una
   banda. Se calcula en coordenadas normalizadas para que el resultado no
   dependa de la escala elegida en el slider. */
function potencial(u, v, t) {
  return Math.sin(u + t * 0.30) * Math.cos(v * 1.1 - t * 0.22)
       + 0.6 * Math.sin((u + v) * 0.7 + t * 0.17)
       + 0.4 * Math.cos((u - v) * 1.3 - t * 0.13);
}

function campoDeFlujo(x, y, t) {
  const s = P.fluidez * 0.0016;
  const u = x * s, v = y * s, e = 0.02;
  return {
    x:  (potencial(u, v + e, t) - potencial(u, v - e, t)) / (2 * e),
    y: -(potencial(u + e, v, t) - potencial(u - e, v, t)) / (2 * e)
  };
}

/* ═══════════════════ Formas ═══════════════════
   Cada trazado deja un path listo para fill/stroke, centrado en (0,0) y
   escalado por r. Los "detalles" (centro de la flor, ojos, dientes) se dibujan
   aparte con un tono más oscuro del mismo color. */

function trazarFlor(g, r, petalos, filo, deform, fase) {
  const pasos = 140;
  g.beginPath();
  for (let i = 0; i <= pasos; i++) {
    const t = (i / pasos) * Math.PI * 2;
    const petalo = Math.pow(Math.abs(Math.cos(petalos * t * 0.5)), filo);
    const onda = 1 + deform * Math.sin(3 * t + fase) * 0.5;
    const rad = r * (0.34 + 0.66 * petalo) * onda;
    const x = Math.cos(t) * rad, y = Math.sin(t) * rad;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}

function trazarCorazon(g, r, deform, fase) {
  const pasos = 90;
  g.beginPath();
  for (let i = 0; i <= pasos; i++) {
    const t = (i / pasos) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    const onda = 1 + deform * Math.sin(2 * t + fase) * 0.4;
    const px = (x / 17) * r * onda, py = (-y / 17) * r * onda;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
}

function trazarMancha(g, r, deform, fase, semilla) {
  const pasos = 100;
  g.beginPath();
  for (let i = 0; i <= pasos; i++) {
    const t = (i / pasos) * Math.PI * 2;
    const onda = 1
      + (0.25 + deform) * Math.sin(3 * t + semilla + fase)
      + (0.16 + deform * 0.6) * Math.sin(5 * t - semilla * 1.7 + fase * 0.8)
      + 0.08 * Math.sin(7 * t + fase * 1.3);
    const rad = r * 0.72 * onda;
    const x = Math.cos(t) * rad, y = Math.sin(t) * rad;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}

function trazarCalavera(g, R) {
  g.beginPath();
  g.moveTo(-0.78 * R, -0.02 * R);
  g.bezierCurveTo(-0.90 * R, -1.00 * R,  0.90 * R, -1.00 * R,  0.78 * R, -0.02 * R);  // cráneo
  g.bezierCurveTo( 0.76 * R,  0.30 * R,  0.56 * R,  0.36 * R,  0.50 * R,  0.46 * R);  // sien derecha
  g.lineTo( 0.44 * R, 0.90 * R);
  g.quadraticCurveTo(0, 1.14 * R, -0.44 * R, 0.90 * R);                               // mandíbula
  g.lineTo(-0.50 * R, 0.46 * R);
  g.bezierCurveTo(-0.56 * R, 0.36 * R, -0.76 * R, 0.30 * R, -0.78 * R, -0.02 * R);
  g.closePath();
}

function detallesCalavera(g, R, oscuro) {
  g.fillStyle = oscuro;
  [-1, 1].forEach(lado => {
    g.save();
    g.translate(lado * 0.34 * R, -0.18 * R);
    g.rotate(lado * 0.2);
    g.beginPath();
    g.ellipse(0, 0, 0.25 * R, 0.30 * R, 0, 0, Math.PI * 2);
    g.fill();
    g.restore();
  });
  g.beginPath();                                   // nariz
  g.moveTo(0, 0.10 * R);
  g.lineTo(0.13 * R, 0.36 * R);
  g.lineTo(-0.13 * R, 0.36 * R);
  g.closePath();
  g.fill();
  for (let i = -1; i <= 1; i++) {                  // dientes
    g.fillRect(i * 0.21 * R - 0.035 * R, 0.58 * R, 0.07 * R, 0.30 * R);
  }
  g.fillRect(-0.32 * R, 0.60 * R, 0.64 * R, 0.05 * R);
}

function trazarDiablito(g, R) {
  g.beginPath();
  g.moveTo(-0.70 * R, -0.40 * R);
  g.quadraticCurveTo(-1.06 * R, -1.10 * R, -0.34 * R, -0.86 * R);   // cuerno izquierdo
  g.quadraticCurveTo(0, -1.04 * R, 0.34 * R, -0.86 * R);            // frente
  g.quadraticCurveTo( 1.06 * R, -1.10 * R,  0.70 * R, -0.40 * R);   // cuerno derecho
  g.quadraticCurveTo( 0.98 * R,  0.28 * R,  0.42 * R,  0.66 * R);   // mejilla derecha
  g.quadraticCurveTo(0, 1.08 * R, -0.42 * R, 0.66 * R);             // pera
  g.quadraticCurveTo(-0.98 * R,  0.28 * R, -0.70 * R, -0.40 * R);
  g.closePath();
}

function detallesDiablito(g, R, oscuro) {
  g.fillStyle = oscuro;
  [-1, 1].forEach(lado => {                        // ojos rasgados
    g.beginPath();
    g.moveTo(lado * 0.54 * R, -0.30 * R);
    g.lineTo(lado * 0.14 * R, -0.08 * R);
    g.lineTo(lado * 0.50 * R,  0.04 * R);
    g.closePath();
    g.fill();
  });
  g.strokeStyle = oscuro;                          // sonrisa
  g.lineWidth = Math.max(1, 0.09 * R);
  g.lineCap = 'round';
  g.beginPath();
  g.arc(0, 0.14 * R, 0.36 * R, 0.16 * Math.PI, 0.84 * Math.PI);
  g.stroke();
}

/* factor de tamaño por tipo: calaveras y diablitos necesitan un poco más para
   que se lean los detalles */
const FACTOR = { flor: 1, corazon: 1, mancha: 1, calavera: 1.1, diablito: 1.1 };

/* ═══════════════════ Población ═══════════════════ */

const PESOS = [
  ['flor', 'pesoFlores'], ['corazon', 'pesoCorazones'], ['mancha', 'pesoManchas'],
  ['calavera', 'pesoCalaveras'], ['diablito', 'pesoDiablitos']
];

function tipoAlAzar() {
  const total = PESOS.reduce((s, [, k]) => s + P[k], 0);
  if (total <= 0) return 'mancha';
  let r = Math.random() * total;
  for (const [tipo, k] of PESOS) {
    r -= P[k];
    if (r <= 0) return tipo;
  }
  return 'mancha';
}

function nuevaForma(dentro = true) {
  return {
    x: dentro ? azar(0, W) : azar(-0.1 * W, 1.1 * W),
    y: dentro ? azar(0, H) : azar(-0.1 * H, 1.1 * H),
    vx: 0, vy: 0,
    tipo: tipoAlAzar(),
    escala: azar(0.35, 1),
    angulo: azar(0, Math.PI * 2),
    giro: azar(-1, 1),
    fase: azar(0, Math.PI * 2),
    ritmo: azar(0.5, 1.6),
    tono: Math.random(),
    semilla: azar(0, Math.PI * 2)
  };
}

function ajustarPoblacion() {
  const objetivo = Math.round(P.cantidad);
  while (formas.length < objetivo) formas.push(nuevaForma(false));
  if (formas.length > objetivo) formas.length = objetivo;
}

function rehacerTipos() { formas.forEach(f => { f.tipo = tipoAlAzar(); }); }

function crearAuras() {
  auras = Array.from({ length: 5 }, () => ({
    x: Math.random(), y: Math.random(),
    r: azar(0.28, 0.6),
    vx: azar(-0.00008, 0.00008),
    vy: azar(-0.00008, 0.00008),
    tono: Math.random()
  }));
}

/* ═══════════════════ Color ═══════════════════ */

/* Un solo camino de color para todo. Con pasosColor = 0 el tono es continuo;
   con 2..8 el rango se corta en escalones (así salen el RGB puro y los fluo). */
function tonoDe(semilla) {
  let base;
  if (P.pasosColor >= 2) {
    const paso = P.rangoTono / P.pasosColor;
    const indice = Math.min(Math.floor(semilla * P.pasosColor), P.pasosColor - 1);
    base = P.tonoBase - P.rangoTono / 2 + indice * paso + paso / 2;
  } else {
    base = P.tonoBase + (semilla - 0.5) * P.rangoTono;
  }
  return ((base + tiempo * P.derivaTono) % 360 + 360) % 360;
}

/* ═══════════════════ Dibujo ═══════════════════ */

function dibujarFondo(dt) {
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  if (P.sinFondo) { fctx.clearRect(0, 0, fondo.width, fondo.height); return; }

  const { r, g, b } = hexARgb(P.fondo);
  fctx.fillStyle = `rgb(${r},${g},${b})`;
  fctx.fillRect(0, 0, fondo.width, fondo.height);
  if (P.auras <= 0.001) return;

  auras.forEach(a => {
    if (!pausado) {
      a.x += a.vx * dt * 60; a.y += a.vy * dt * 60;
      if (a.x < -0.3 || a.x > 1.3) a.vx *= -1;
      if (a.y < -0.3 || a.y > 1.3) a.vy *= -1;
    }
    const cx = a.x * fondo.width, cy = a.y * fondo.height;
    const rad = a.r * Math.max(fondo.width, fondo.height);
    const tono = tonoDe(a.tono);
    const grad = fctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    grad.addColorStop(0, `hsla(${tono}, ${P.saturacion}%, ${clamp(P.luminosidad + 8, 0, 96)}%, ${0.55 * P.auras})`);
    grad.addColorStop(1, `hsla(${tono}, ${P.saturacion}%, ${P.luminosidad}%, 0)`);
    fctx.fillStyle = grad;
    fctx.beginPath();
    fctx.arc(cx, cy, rad, 0, Math.PI * 2);
    fctx.fill();
  });
}

function dibujarForma(f) {
  const pulso = 1 + P.latido * Math.sin(tiempo * f.ritmo * 1.6 + f.fase);
  const r = P.tamano * (1 - P.variacion + P.variacion * f.escala * 2) * 0.5 * pulso * FACTOR[f.tipo];
  if (r <= 0.4) return;

  const tono = tonoDe(f.tono);
  const color = `hsla(${tono}, ${P.saturacion}%, ${P.luminosidad}%, ${P.opacidad})`;
  const oscuro = `hsla(${(tono + 12) % 360}, ${clamp(P.saturacion - 5, 0, 100)}%, ${clamp(P.luminosidad - 42, 6, 90)}%, ${clamp(P.opacidad + 0.15, 0, 1)})`;

  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.angulo);

  if (P.brillo > 0) {
    ctx.shadowBlur = P.brillo;
    ctx.shadowColor = `hsla(${tono}, ${P.saturacion}%, ${clamp(P.luminosidad + 6, 0, 96)}%, 0.9)`;
  }
  ctx.fillStyle = color;

  if (f.tipo === 'flor') {
    trazarFlor(ctx, r, Math.round(P.petalos), P.filoPetalo, P.deformacion, f.fase + tiempo * 0.4);
  } else if (f.tipo === 'corazon') {
    trazarCorazon(ctx, r, P.deformacion, f.fase + tiempo * 0.5);
  } else if (f.tipo === 'mancha') {
    trazarMancha(ctx, r, P.deformacion, tiempo * 0.35 + f.fase, f.semilla);
  } else {
    /* calaveras y diablitos: la deformación se aplica como squash & stretch
       para no romper la silueta, que es lo que las hace reconocibles */
    const s = P.deformacion * 0.35 * Math.sin(tiempo * 0.9 + f.fase);
    ctx.scale(1 + s, 1 - s);
    (f.tipo === 'calavera' ? trazarCalavera : trazarDiablito)(ctx, r * 0.9);
  }

  ctx.fill();

  if (P.contorno > 0) {
    ctx.shadowBlur = 0;
    ctx.lineWidth = P.contorno;
    ctx.strokeStyle = oscuro;
    ctx.stroke();
  }

  if (P.detalles) {
    ctx.shadowBlur = 0;
    if (f.tipo === 'flor') {
      ctx.fillStyle = `hsla(${(tono + 45) % 360}, ${clamp(P.saturacion + 10, 0, 100)}%, ${clamp(P.luminosidad - 18, 10, 95)}%, ${clamp(P.opacidad + 0.25, 0, 1)})`;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
      ctx.fill();
    } else if (f.tipo === 'calavera') {
      detallesCalavera(ctx, r * 0.9, oscuro);
    } else if (f.tipo === 'diablito') {
      detallesDiablito(ctx, r * 0.9, oscuro);
    }
  }

  ctx.restore();
}

function dibujarBrillitos(dt) {
  if (!P.brillitos) return;
  if (!pausado && brillitos.length < 90 && Math.random() < 0.5) {
    brillitos.push({ x: azar(0, W), y: azar(0, H), r: azar(1, 3.4), vida: 1, ritmo: azar(0.4, 1.2) });
  }
  ctx.shadowBlur = 0;
  for (let i = brillitos.length - 1; i >= 0; i--) {
    const b = brillitos[i];
    if (!pausado) b.vida -= dt * 0.35 * b.ritmo;
    if (b.vida <= 0) { brillitos.splice(i, 1); continue; }
    ctx.fillStyle = `hsla(${(P.tonoBase + 30) % 360}, 100%, 96%, ${Math.sin(b.vida * Math.PI) * 0.9})`;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ═══════════════════ Simulación ═══════════════════ */

const RADIO_IMAN = 320;   // alcance del mouse, en px

function actualizar(dt) {
  const margen = P.tamano * 1.2 + 60;

  formas.forEach(f => {
    const c = campoDeFlujo(f.x, f.y, tiempo);

    let objVx = c.x * P.turbulencia * 95;
    let objVy = c.y * P.turbulencia * 95 + P.deriva * 90;

    /* Imán del mouse (negativo = repele). La componente tangencial hace que
       las formas ORBITEN el cursor en vez de colapsar todas en el mismo punto,
       y adentro de los 70 px la atracción radial se apaga. */
    if (mouse.activo && P.iman !== 0) {
      const dx = mouse.x - f.x, dy = mouse.y - f.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < RADIO_IMAN) {
        const caida = 1 - d / RADIO_IMAN;
        const nucleo = clamp((d - 70) / 70, 0, 1);
        const radial = P.iman * 190 * caida * nucleo;
        const tang   = Math.abs(P.iman) * 210 * caida;
        objVx += (dx / d) * radial + (-dy / d) * tang;
        objVy += (dy / d) * radial + ( dx / d) * tang;
      }
    }

    /* inercia: la velocidad persigue a la deseada, nunca salta de golpe */
    const k = 1 - Math.pow(0.2, dt);
    f.vx += (objVx - f.vx) * k;
    f.vy += (objVy - f.vy) * k;

    f.x += f.vx * P.velocidad * dt;
    f.y += f.vy * P.velocidad * dt;
    f.angulo += f.giro * P.giro * dt * 0.6;

    /* envolver por los bordes (el lienzo es un toro) */
    if (f.x < -margen) f.x = W + margen; else if (f.x > W + margen) f.x = -margen;
    if (f.y < -margen) f.y = H + margen; else if (f.y > H + margen) f.y = -margen;
  });
}

let ultimo = performance.now();

function bucle(ahora) {
  const dt = Math.min((ahora - ultimo) / 1000, 0.05);
  ultimo = ahora;
  if (!pausado) tiempo += dt;

  dibujarFondo(dt);

  /* estela: en vez de borrar, se destiñe lo dibujado antes */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = `rgba(0,0,0,${clamp(1 - P.estela, 0.01, 1)})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  if (!pausado) actualizar(dt);
  formas.forEach(dibujarForma);
  dibujarBrillitos(dt);

  if (grabando) volcarCuadro();

  requestAnimationFrame(bucle);
}

/* ═══════════════════ Encuadre y lienzos ═══════════════════ */

/* Con formato fijo el escenario deja de ser la ventana entera: es una caja
   centrada con esa proporción, y la simulación corre adentro. Lo que se ve es
   exactamente lo que se exporta. */
function redimensionar() {
  const f = FORMATOS[formato];
  const antesW = W, antesH = H;
  const dispW = window.innerWidth, dispH = window.innerHeight;
  let bw = dispW, bh = dispH, bx = 0, by = 0;

  if (f.ratio) {
    const margen = dispW < 680 ? 12 : 34;
    const dispoW = dispW - margen * 2, dispoH = dispH - margen * 2;
    bw = Math.min(dispoW, dispoH * f.ratio);
    bh = bw / f.ratio;
    bx = (dispW - bw) / 2;
    by = (dispH - bh) / 2;
  }

  escenario.classList.toggle('is-encuadrado', !!f.ratio);
  escenario.style.left   = `${bx}px`;
  escenario.style.top    = `${by}px`;
  escenario.style.width  = `${bw}px`;
  escenario.style.height = `${bh}px`;

  W = Math.round(bw);
  H = Math.round(bh);

  /* Al cambiar de tamaño o de formato, las formas se reacomodan en proporción:
     así la composición sobrevive el cambio. Si antes no había tamaño (primer
     layout, ventana todavía en 0), se resiembran para que no queden todas
     apiladas en la esquina. */
  if (formas.length) {
    if (antesW > 0 && antesH > 0) {
      const kx = W / antesW, ky = H / antesH;
      formas.forEach(f => { f.x *= kx; f.y *= ky; });
    } else {
      formas.forEach(f => { f.x = azar(0, W); f.y = azar(0, H); });
    }
  }

  /* al grabar se sube la resolución interna para que el video salga nítido
     sin cambiar nada de lo que se ve en pantalla */
  DPR = grabando
    ? destino().ancho / W
    : Math.min(window.devicePixelRatio || 1, 2);

  escena.width  = Math.round(W * DPR);
  escena.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  /* el fondo se dibuja chico y el CSS lo estira con blur: mucho más barato */
  fondo.width  = Math.max(8, Math.round(W * 0.16));
  fondo.height = Math.max(8, Math.round(H * 0.16));
}

function ponerFormato(nombre) {
  if (grabando) return;
  formato = nombre;
  document.querySelectorAll('[data-formato]').forEach(b => {
    b.classList.toggle('is-activo', b.dataset.formato === nombre);
  });
  redimensionar();
  actualizarNota();
}

/* ═══════════════════ Export (PNG y video) ═══════════════════ */

/* Tamaño real de salida: el del formato, o la ventana redondeada a par
   (los códecs de video piden dimensiones pares). */
function destino() {
  const f = FORMATOS[formato];
  if (f.ratio) return { ancho: f.ancho, alto: f.alto };
  const escala = Math.min(2, window.devicePixelRatio || 1);
  return {
    ancho: Math.round(W * escala / 2) * 2,
    alto:  Math.round(H * escala / 2) * 2
  };
}

const auxiliar = document.createElement('canvas');
const auxCtx = auxiliar.getContext('2d');

/* Rehace en un lienzo lo mismo que muestra el CSS: fondo desenfocado + escena.
   El desenfoque se aplica en un lienzo intermedio chico (el fondo ya es una
   textura de baja resolución), así el costo por cuadro sigue siendo bajo. */
function componer(g, ancho, alto, colorForzado) {
  const color = colorForzado !== undefined ? colorForzado : (P.sinFondo ? MATTES[matte] : null);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, ancho, alto);

  if (P.sinFondo) {
    /* sin aguada de color: o queda transparente, o se rellena con el matte */
    g.imageSmoothingEnabled = true;
    if (color) { g.fillStyle = color; g.fillRect(0, 0, ancho, alto); }
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.drawImage(escena, 0, 0, ancho, alto);
    return;
  }

  const k = ancho / W;                       // escala respecto de lo que se ve
  auxiliar.width  = Math.max(8, Math.round(ancho * 0.25));
  auxiliar.height = Math.max(8, Math.round(alto  * 0.25));
  auxCtx.setTransform(1, 0, 0, 1, 0, 0);
  auxCtx.clearRect(0, 0, auxiliar.width, auxiliar.height);
  auxCtx.filter = `blur(${Math.max(1, 60 * k * 0.25)}px) saturate(1.15)`;
  auxCtx.drawImage(fondo,
    -auxiliar.width * 0.075, -auxiliar.height * 0.075,
    auxiliar.width * 1.15, auxiliar.height * 1.15);
  auxCtx.filter = 'none';

  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';
  g.drawImage(auxiliar, 0, 0, ancho, alto);
  g.drawImage(escena, 0, 0, ancho, alto);
}

function descargar(url, nombre) {
  ultimoArchivo = nombre;
  actualizarComando();
  const a = document.createElement('a');
  a.download = nombre;
  a.href = url;
  a.click();
}

function guardarPNG() {
  const { ancho, alto } = destino();
  const salida = document.createElement('canvas');
  salida.width = ancho; salida.height = alto;
  componer(salida.getContext('2d'), ancho, alto);
  descargar(salida.toDataURL('image/png'), `visual-${ancho}x${alto}-${Date.now()}.png`);
}

/* --- Video ---
   Se graba un lienzo aparte del tamaño de salida: cada cuadro se compone ahí
   y se empuja al stream con requestFrame(), así el video no depende de que el
   navegador capture a tiempo. */
const MIMES = [
  'video/mp4;codecs=avc1.42E01E',
  'video/mp4',
  'video/webm;codecs=vp9',
  'video/webm;codecs=vp8',
  'video/webm'
];
const DURACION_MAX = 60;   // segundos: corta sola para no comerse la memoria

let grabando = false;
let grabador = null, pistaVideo = null, trozos = [], grabCanvas = null, grabCtx = null;
let inicioGrabacion = 0, ultimoVolcado = 0;

const recBadge = document.getElementById('rec');
const recTiempo = document.getElementById('recTiempo');

/* El navegador NO puede escribir QuickTime: MediaRecorder.isTypeSupported
   ('video/quicktime') y ProRes ('ap4h') dan false. Lo único con canal alfa que
   sabe grabar es WebM VP9, así que ese es el master para "sin fondo", y el
   .mov ProRes 4444 sale de una conversión local (ver comandoMov()). Para todo
   lo demás, MP4/H.264. */
function conAlfa() {
  return P.sinFondo && !MATTES[matte];
}

function mimeSoportado() {
  if (typeof MediaRecorder === 'undefined') return null;
  const lista = conAlfa()
    ? ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    : MIMES;
  return lista.find(m => MediaRecorder.isTypeSupported(m)) || null;
}

/* Conversión a QuickTime con alfa. ProRes 4444 (yuva444p10le) es el formato
   que Premiere, After Effects y Final Cut abren con transparencia nativa. */
let ultimoArchivo = 'visual.webm';

function comandoMov() {
  const base = ultimoArchivo.replace(/\.[^.]+$/, '');
  return `ffmpeg -i ${ultimoArchivo} -c:v prores_ks -profile:v 4444 -pix_fmt yuva444p10le ${base}.mov`;
}

function volcarCuadro() {
  const ahora = performance.now();
  if (ahora - ultimoVolcado < 1000 / 30) return;      // 30 fps
  ultimoVolcado = ahora;
  componer(grabCtx, grabCanvas.width, grabCanvas.height);
  if (pistaVideo && pistaVideo.requestFrame) pistaVideo.requestFrame();

  const seg = (ahora - inicioGrabacion) / 1000;
  recTiempo.textContent = `${Math.floor(seg / 60)}:${String(Math.floor(seg % 60)).padStart(2, '0')}`;
  if (seg >= DURACION_MAX) detenerGrabacion();
}

function iniciarGrabacion() {
  const mime = mimeSoportado();
  if (!mime) { alert('Este navegador no permite grabar video desde el canvas. Probá con Chrome.'); return; }

  const { ancho, alto } = destino();
  grabCanvas = document.createElement('canvas');
  grabCanvas.width = ancho; grabCanvas.height = alto;
  grabCtx = grabCanvas.getContext('2d', { alpha: true });

  const stream = grabCanvas.captureStream(0);
  pistaVideo = stream.getVideoTracks()[0];
  trozos = [];
  grabador = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14e6 });
  grabador.ondataavailable = e => { if (e.data.size) trozos.push(e.data); };
  grabador.onstop = () => {
    const blob = new Blob(trozos, { type: mime });
    const ext = mime.includes('mp4') ? 'mp4' : 'webm';
    const url = URL.createObjectURL(blob);
    descargar(url, `visual-${ancho}x${alto}-${Date.now()}.${ext}`);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    trozos = [];
  };

  grabando = true;
  inicioGrabacion = performance.now();
  ultimoVolcado = 0;
  redimensionar();                    // sube la resolución interna al tamaño de salida
  grabador.start();

  recBadge.classList.add('is-visible');
  recTiempo.textContent = '0:00';
  btnRec.textContent = 'Detener y guardar';
  btnRec.classList.add('is-grabando');
  document.querySelectorAll('[data-formato]').forEach(b => b.disabled = true);
}

function detenerGrabacion() {
  if (!grabando) return;
  grabando = false;
  if (grabador && grabador.state !== 'inactive') grabador.stop();
  pistaVideo = null;
  redimensionar();                    // vuelve a la resolución de pantalla

  recBadge.classList.remove('is-visible');
  btnRec.textContent = 'Grabar video';
  btnRec.classList.remove('is-grabando');
  document.querySelectorAll('[data-formato]').forEach(b => b.disabled = false);
}

/* ═══════════════════ Eventos ═══════════════════ */

window.addEventListener('resize', () => { redimensionar(); actualizarNota(); });
window.addEventListener('pointermove', e => {
  const r = escenario.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
  mouse.activo = true;
});
document.addEventListener('mouseleave', () => { mouse.activo = false; });
window.addEventListener('blur', () => { mouse.activo = false; });

window.addEventListener('keydown', e => {
  if (e.target.matches('input, button')) return;
  if (e.code === 'Space') { e.preventDefault(); pausado = !pausado; }
  if (e.key.toLowerCase() === 'r') aleatorizar();
  if (e.key.toLowerCase() === 'h') panel.classList.toggle('is-cerrado');
});

/* ═══════════════════ Panel ═══════════════════ */

const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
const panelToggle = document.getElementById('panelToggle');
const refs = {};
let btnRec = null;

function bloque(titulo, html) {
  const div = document.createElement('div');
  div.className = 'grupo';
  div.innerHTML = `<h2 class="grupo__titulo">${titulo}</h2>${html}`;
  panelBody.appendChild(div);
  return div;
}

function construirPanel() {
  /* --- formato y export --- */
  const exp = bloque('Formato y export', `
    <div class="fila-botones">
      ${Object.keys(FORMATOS).map(n => `<button class="chip${n === formato ? ' is-activo' : ''}" type="button" data-formato="${n}">${n}</button>`).join('')}
    </div>
    <div class="fila-botones" id="filaMatte" hidden>
      ${Object.entries(MATTES).map(([n, c]) => `<button class="chip${n === matte ? ' is-activo' : ''}" type="button" data-matte="${n}"><span class="chip__punto" style="background:${c || 'repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 50% / 6px 6px'}"></span>${n}</button>`).join('')}
    </div>
    <div class="botones">
      <button class="btn btn--ancho btn--rec" type="button" id="btnRec">Grabar video</button>
      <button class="btn btn--ancho" type="button" id="btnPng">Guardar PNG</button>
    </div>
    <p class="nota" id="notaExport"></p>
    <div id="bloqueMov" hidden>
      <div class="comando" id="comandoMov"></div>
      <div class="comando__pie">
        <button class="chip" type="button" id="btnCopiar">Copiar</button>
        <p class="nota">Convierte el WebM con alfa a QuickTime ProRes 4444.</p>
      </div>
    </div>`);

  exp.querySelectorAll('[data-formato]').forEach(b => {
    b.addEventListener('click', () => { ponerFormato(b.dataset.formato); actualizarNota(); });
  });
  exp.querySelectorAll('[data-matte]').forEach(b => {
    b.addEventListener('click', () => {
      matte = b.dataset.matte;
      exp.querySelectorAll('[data-matte]').forEach(o => o.classList.toggle('is-activo', o === b));
      actualizarNota();
    });
  });
  document.getElementById('btnCopiar').addEventListener('click', copiarComando);
  btnRec = document.getElementById('btnRec');
  btnRec.addEventListener('click', () => grabando ? detenerGrabacion() : iniciarGrabacion());
  document.getElementById('btnPng').addEventListener('click', guardarPNG);

  /* --- universos y paletas --- */
  const uni = bloque('Universo', `
    <div class="fila-botones">
      ${Object.keys(UNIVERSOS).map(n => `<button class="chip" type="button" data-universo="${n}">${n}</button>`).join('')}
    </div>`);
  uni.querySelectorAll('[data-universo]').forEach(b => {
    b.addEventListener('click', () => setValores(UNIVERSOS[b.dataset.universo]));
  });

  const pal = bloque('Paleta', `
    <div class="fila-botones">
      ${Object.entries(PALETAS).map(([n, p]) => `<button class="chip" type="button" data-paleta="${n}"><span class="chip__punto" style="background:${p.muestra}"></span>${n}</button>`).join('')}
    </div>`);
  pal.querySelectorAll('[data-paleta]').forEach(b => {
    b.addEventListener('click', () => {
      const { muestra, ...color } = PALETAS[b.dataset.paleta];
      setValores(color);
    });
  });

  /* --- sliders generados desde PARAMETROS --- */
  PARAMETROS.forEach(grupo => {
    const cont = bloque(grupo.grupo, '');
    grupo.controles.forEach(c => {
      const fila = document.createElement('div');
      fila.className = 'ctrl';

      if (c.tipo === 'switch') {
        fila.innerHTML = `<label class="check"><input type="checkbox" ${c.valor ? 'checked' : ''}> ${c.label}</label>`;
        const input = fila.querySelector('input');
        input.addEventListener('change', () => aplicar(c.clave, input.checked));
        refs[c.clave] = { input };
      } else if (c.tipo === 'color') {
        fila.innerHTML = `<div class="ctrl__fila"><span>${c.label}</span></div>
                          <input type="color" value="${c.valor}">`;
        const input = fila.querySelector('input');
        input.addEventListener('input', () => aplicar(c.clave, input.value));
        refs[c.clave] = { input };
      } else {
        fila.innerHTML = `<div class="ctrl__fila"><span>${c.label}</span><span class="ctrl__valor"></span></div>
                          <input type="range" min="${c.min}" max="${c.max}" step="${c.paso}" value="${c.valor}">`;
        const input = fila.querySelector('input');
        const salida = fila.querySelector('.ctrl__valor');
        salida.textContent = c.clave === 'pasosColor' && c.valor === 0 ? 'continuo' : c.valor;
        input.addEventListener('input', () => aplicar(c.clave, parseFloat(input.value)));
        refs[c.clave] = { input, salida };
      }
      cont.appendChild(fila);
    });
  });

  /* --- presets y acciones --- */
  const acc = bloque('Presets', `
    <div class="fila-botones">
      ${Object.keys(PRESETS).map(n => `<button class="chip" type="button" data-preset="${n}">${n}</button>`).join('')}
    </div>
    <div class="botones">
      <button class="btn" type="button" id="btnAzar">Aleatorizar</button>
      <button class="btn" type="button" id="btnPausa">Pausar</button>
      <button class="btn" type="button" id="btnReset">Reiniciar</button>
      <button class="btn" type="button" id="btnSemillas">Resembrar</button>
    </div>`);

  acc.querySelectorAll('[data-preset]').forEach(b => {
    b.addEventListener('click', () => aplicarPreset(b.dataset.preset));
  });
  document.getElementById('btnAzar').addEventListener('click', aleatorizar);
  document.getElementById('btnReset').addEventListener('click', () => { setValores(DEFECTOS); resembrar(); });
  document.getElementById('btnSemillas').addEventListener('click', resembrar);
  const btnPausa = document.getElementById('btnPausa');
  btnPausa.addEventListener('click', () => {
    pausado = !pausado;
    btnPausa.textContent = pausado ? 'Seguir' : 'Pausar';
  });

  actualizarNota();
}

function actualizarNota() {
  const { ancho, alto } = destino();
  const mime = mimeSoportado();
  const ext = mime ? (mime.includes('mp4') ? 'MP4' : 'WEBM') : 'no disponible';
  const detalle = !P.sinFondo
    ? ''
    : conAlfa()
      ? ' · sin fondo: PNG y WebM VP9 con canal alfa (el navegador no puede escribir QuickTime; se convierte abajo)'
      : ` · fondo plano ${matte.toLowerCase()} para cromar`;
  document.getElementById('notaExport').textContent =
    `Salida ${ancho}×${alto} · video ${ext} a 30 fps (corta solo a los ${DURACION_MAX} s)${detalle}.`;
  actualizarComando();
}

function actualizarComando() {
  const bloque = document.getElementById('bloqueMov');
  if (!bloque) return;
  bloque.hidden = !conAlfa();
  document.getElementById('comandoMov').textContent = comandoMov();
}

function copiarComando() {
  const texto = comandoMov();
  const listo = () => {
    const b = document.getElementById('btnCopiar');
    b.textContent = 'Copiado';
    setTimeout(() => { b.textContent = 'Copiar'; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(listo, copiarAlaAntigua);
  } else {
    copiarAlaAntigua();
  }
  /* file:// suele bloquear el portapapeles moderno: red de seguridad */
  function copiarAlaAntigua() {
    const t = document.createElement('textarea');
    t.value = texto;
    document.body.appendChild(t);
    t.select();
    try { document.execCommand('copy'); listo(); } catch (e) {}
    t.remove();
  }
}

function aplicar(clave, valor) {
  P[clave] = valor;
  const r = refs[clave];
  if (r && r.salida) r.salida.textContent = (clave === 'pasosColor' && valor === 0) ? 'continuo' : valor;
  if (clave === 'cantidad') ajustarPoblacion();
  if (clave.startsWith('peso')) rehacerTipos();
  if (clave === 'sinFondo') {
    escenario.classList.toggle('is-transparente', !!valor);
    const fila = document.getElementById('filaMatte');
    if (fila) fila.hidden = !valor;
    actualizarNota();
  }
}

function setValores(valores) {
  Object.entries(valores).forEach(([clave, valor]) => {
    const r = refs[clave];
    if (!r) return;
    if (r.input.type === 'checkbox') r.input.checked = valor;
    else r.input.value = valor;
    aplicar(clave, valor);
  });
}

function aplicarPreset(nombre) {
  setValores(DEFECTOS);
  setValores(PRESETS[nombre] || {});
  resembrar();
}

function aleatorizar() {
  const nuevos = {};
  PARAMETROS.forEach(g => g.controles.forEach(c => {
    if (c.tipo === 'switch')            nuevos[c.clave] = Math.random() < 0.7;
    else if (c.tipo === 'color')        return;                       // el fondo se respeta
    else if (c.clave === 'cantidad')    nuevos[c.clave] = Math.round(azar(30, 150));
    else if (c.clave === 'estela')      nuevos[c.clave] = alPaso(azar(0.72, 0.97), c.paso);
    else if (c.clave === 'opacidad')    nuevos[c.clave] = alPaso(azar(0.35, 0.95), c.paso);
    else if (c.clave === 'luminosidad') nuevos[c.clave] = alPaso(azar(45, 82), c.paso);
    else if (c.clave === 'velocidad')   nuevos[c.clave] = alPaso(azar(0.3, 2), c.paso);
    else if (c.clave === 'pasosColor')  nuevos[c.clave] = Math.random() < 0.5 ? 0 : Math.round(azar(2, 6));
    else nuevos[c.clave] = alPaso(azar(c.min, c.max), c.paso);
  }));
  setValores(nuevos);
  resembrar();
}

function resembrar() {
  formas = [];
  ajustarPoblacion();
  crearAuras();
  brillitos = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
}

panelToggle.addEventListener('click', e => {
  e.stopPropagation();
  panel.classList.toggle('is-cerrado');
  panelToggle.textContent = panel.classList.contains('is-cerrado') ? '+' : '–';
});
document.getElementById('panelHead').addEventListener('click', () => panelToggle.click());

/* ═══════════════════ Arranque ═══════════════════ */

construirPanel();
redimensionar();
resembrar();
actualizarNota();
requestAnimationFrame(bucle);
</script>
</body>
</html>
